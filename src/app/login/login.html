<form class="login-form" [formGroup]="form" (ngSubmit)="onSubmit()" novalidate>
  <label class="field">
    <span class="label">Email</span>
    <input class="input" type="email" formControlName="email" autocomplete="email" />
  </label>

  <p class="error" *ngIf="form.controls.email.touched && form.controls.email.hasError('email')">
    Veuillez entrer un email valide.
  </p>

  <label class="field">
    <span class="label">Mot de passe</span>
    <input
      class="input"
      type="password"
      formControlName="password"
      autocomplete="current-password"
    />
  </label>

  <button class="button" type="submit" [disabled]="form.invalid">Login</button>
</form>
